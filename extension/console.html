<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AfterChat AutoSync 控制台</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #656d76;
      --border: #d0d7de;
      --panel: #f6f8fa;
      --accent: #0969da;
      --danger: #cf222e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #8b949e;
        --border: #30363d;
        --panel: #161b22;
        --accent: #58a6ff;
        --danger: #f85149;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      width: 520px;
      min-height: 360px;
      background: var(--bg);
      color: var(--fg);
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      font-size: 14px;
      margin: 0 0 2px;
      font-weight: 600;
    }
    #rootName { color: var(--muted); font-size: 12px; }
    .header-text { flex: 1; min-width: 0; }
    .header-text h1 { white-space: nowrap; }
    #rootName { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    button {
      background: var(--panel);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font: inherit;
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover { border-color: var(--accent); }
    button:disabled { opacity: .6; cursor: default; }
    main { padding: 12px 14px 16px; }
    section + section { margin-top: 16px; }
    h2 {
      font-size: 12px;
      text-transform: none;
      color: var(--muted);
      font-weight: 600;
      margin: 0 0 6px;
    }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th, td {
      text-align: left;
      padding: 5px 6px;
      border-bottom: 1px solid var(--border);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    th { color: var(--muted); font-weight: 600; font-size: 12px; }
    td.col-platform { width: 96px; }
    td.col-when { width: 130px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .empty { color: var(--muted); padding: 8px 0; }
    .platform-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 5px 6px;
      border-bottom: 1px solid var(--border);
    }
    .platform-row .counts { color: var(--muted); font-variant-numeric: tabular-nums; }
    #status { margin-top: 10px; color: var(--danger); min-height: 1em; font-size: 12px; }
    #detail { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 16px; }
    #detail.hidden { display: none; }
    .detail-card { width: 100%; max-height: 90vh; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; display: flex; flex-direction: column; }
    .detail-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
    .detail-head strong { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #detailBody { margin: 0; padding: 12px; overflow: auto; white-space: pre-wrap; word-break: break-word; font: 12px/1.6 ui-monospace, Consolas, monospace; }
  </style>
</head>
<body>
  <header>
    <div class="header-text">
      <h1>AfterChat AutoSync 控制台</h1>
      <div id="rootName">未选择目录</div>
    </div>
    <button id="pickBtn" type="button">选择/更换目录</button>
  </header>

  <main>
    <section>
      <h2>最近聊天</h2>
      <table>
        <thead>
          <tr><th style="width:96px">平台</th><th style="width:130px">时间</th><th>标题</th></tr>
        </thead>
        <tbody id="chatsBody"></tbody>
      </table>
      <div id="chatsEmpty" class="empty">暂无已同步聊天</div>
    </section>

    <section>
      <h2>平台状态</h2>
      <div id="platforms"></div>
    </section>

    <div id="status" role="status" aria-live="polite"></div>
  </main>

  <div id="detail" class="hidden" role="dialog" aria-modal="true" aria-label="聊天详情">
    <div class="detail-card">
      <div class="detail-head">
        <strong id="detailTitle">聊天详情</strong>
        <button id="detailClose" type="button">关闭</button>
      </div>
      <pre id="detailBody"></pre>
    </div>
  </div>

  <script src="console.js"></script>
</body>
</html>
