name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release:
        description: "发布当前 version.json 为 Release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read version
        id: version
        run: |
          VERSION=$(python -c "import json; print(json.load(open('version.json', encoding='utf-8'))['release'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "suffix=${VERSION##*-}" >> "$GITHUB_OUTPUT"

      - name: Verify pushed tag matches version.json
        if: github.ref_type == 'tag' && github.ref != format('refs/tags/v{0}', steps.version.outputs.version)
        run: |
          echo "tag mismatch: ${{ github.ref }} != v${{ steps.version.outputs.version }}"
          exit 1

      - name: Build userscript
        run: |
          python tools/patch_afterchat.py \
            --source-file vendor/afterchat.user.js \
            --module tools/ac-sync.module.js \
            --out dist/afterchat-autosync.user.js \
            --version-tag "${{ steps.version.outputs.suffix }}"

      - name: Verify userscript
        run: |
          python tools/patch_afterchat.py --check --out dist/afterchat-autosync.user.js
          python tools/verify_autosync.py --base .
          node --check dist/afterchat-autosync.user.js

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: afterchat-autosync-${{ steps.version.outputs.version }}
          path: dist/afterchat-autosync.user.js
          if-no-files-found: error

      - name: Create release
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.release == true)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            dist/afterchat-autosync.user.js \
            --title "AfterChat AutoSync ${{ steps.version.outputs.version }}" \
            --notes "Automated build from ${{ github.sha }}."
